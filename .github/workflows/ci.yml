---
name: CI

on:
  push:
    branches: [develop, main, master]
  pull_request:
    branches: [develop, main, master]
  workflow_dispatch:
# a new push to a pull request cancels its outdated run, runs of the branches themselves are kept
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # the reusable lint job of mcloud-conventions (CONVENTIONS.md)
  lint:
    uses: zebrunner/mcloud-conventions/.github/workflows/lint.yml@v1
    with:
      java-version: "11"
      timeout-minutes: 15

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Unit and STF integration tests
        run: mvn -B verify
      - name: Tests report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: target/surefire-reports/**/TEST-*.xml
          check_name: tests report
          annotate_only: true
          detailed_summary: true
          require_tests: true
      - name: Upload tests JUnit XML and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: tests
          path: |
            target/surefire-reports/**/TEST-*.xml
            target/site/jacoco/

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # id-token: the login to public.ecr.aws
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # the anonymous pulls of public.ecr.aws are limited to 1 per second per IP of the runners
      - uses: zebrunner/mcloud-conventions/.github/actions/ecr-public-login@v1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      # the builds of the image keep their layers in the cache of GitHub Actions (type=gha): the Maven dependencies of
      # pom.xml (dependency:go-offline) and the packages are built again only when they change; the builder needs the
      # runtime of the cache, the image is loaded into docker for the tests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
        with:
          use: false
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Docker image checks
        run: tests/docker_test.sh
        env:
          JUNIT_DIR: ${{ runner.temp }}/junit
          DOCKER_BUILD_OPTS: >-
            --builder ${{ steps.buildx.outputs.name }} --load --cache-from type=gha --cache-to type=gha,mode=max
      # Only the local disposable hub is exercised; real grids require an explicit manual run.
      - name: Load test of the image with fake Appium nodes
        id: load_test
        run: tests/load_local.sh -Dload.fakeNodes=10 -Dload.sessions=200 -Dload.concurrency=20 -Dload.maxErrorRate=0
        env:
          # the image of the checks above, from the cache of the builder
          DOCKER_BUILD_OPTS: --builder ${{ steps.buildx.outputs.name }} --load
      # one report per path: the action pairs report_paths with check_name items
      - name: Docker image report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: ${{ runner.temp }}/junit/*.xml
          check_name: docker image report
          annotate_only: true
          detailed_summary: true
          require_tests: true
      - name: Load test report
        if: ${{ !cancelled() && steps.load_test.outcome != 'skipped' }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: target/surefire-reports/**/TEST-*.xml
          check_name: load test report
          annotate_only: true
          detailed_summary: true
          require_tests: true
      - name: Upload docker JUnit XML and load report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: docker
          path: |
            ${{ runner.temp }}/junit/
            target/surefire-reports/**/TEST-*.xml
            target/load-report/

  # the image of a merge into develop to public.ecr.aws after all the checks (CONVENTIONS.md#versions)
  publish:
    needs: [lint, tests, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
    uses: zebrunner/mcloud-conventions/.github/workflows/docker-publish.yml@v1
